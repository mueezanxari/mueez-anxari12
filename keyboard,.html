<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./keyboard.css">
</head>
<body>
    <header>
        <div class="banner">
         <h1>Keyboard Drum Kit</h1>
        </div>
    </header>
        <div class="keys">
            <div data-key="65" class="key">
                <kbd>A</kbd>
                <span class="Sound">CLAP</span>
            </div>
            <div data-key="83" class="key">
                <kbd>S</kbd>
                <span class="Sound">HIHAT</span>
            </div>
            <div data-key="68" class="key">
                <kbd>D</kbd>
                <span class="Sound">KICK</span>
            </div>
            <div data-key="70" class="key">
                <kbd>F</kbd>
                <span class="Sound">OPENHAT</span>
            </div>
            <div data-key="71" class="key">
                <kbd>J</kbd>
                <span class="Sound">BOOM</span>
            </div>
            <div data-key="72" class="key">
                <kbd>K</kbd>
                <span class="Sound">RIDE</span>
            </div>
            <div data-key="72" class="key">
                <kbd>L</kbd>
                <span class="Sound">SNARE</span>
            </div>
            <div data-key="74" class="key">
                <kbd>:</kbd>
                <span class="Sound">TOM</span>
            </div>
            <div data-key="75" class="key">
                <kbd>"</kbd>
                <span class="Sound">LINK</span>
            </div>
        </div>
<audio data-key="65" src="./audio/clap.mp3"></audio>
<audio data-key="83" src="./audio/hithat.mp3"></audio>
<audio data-key="68" src="./audio/kick.mp3"></audio>
<audio data-key="70" src="./audio/ohat.mp3"></audio>
<audio data-key="71" src="./audio/boom.mp3"></audio>
<audio data-key="72" src="./audio/ride.mp3"></audio>
<audio data-key="74" src="./audio/snare.mp3"></audio>
<audio data-key="75" src="./audio/tom.mp3"></audio>
<audio data-key="76" src="./audio/link.mp3"></audio>
    <script>
        window.addEventListener('keydown', function(e) { 
            const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);
            const key = document.querySelector(`.key[data-key="${e.keyCode}"]`);
            if(!audio) return; // stop the function from running all together
            audio.currentTime = 0; // rewind to the start
            audio.play();
            key.classList.add('playing');
        });

        function removeTransition(e) {
            console.log(e.propertyName); //skip it if it's not a 
            transform
            if (e.propertyName !== 'transform') return; 
            this.classList.remove('playing');
        }
    

        const keys = document.querySelectorAll('.key');
        keys.forEach(key => key.addEventListener('transitionend', removeTransition));
    </script>
</body>
</html>
